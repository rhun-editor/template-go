# The manifest. rhun reads it from ~/.config/rhun/extensions/OWNER/NAME/extension.ini.
# name and owner must equal the folder names; the release workflow checks that too.
name = hello
owner = rhun-editor
title = Hello
description = A starting point for your own extension, in Go: one command that says hello.
# the badge in the title bar and on the Extensions page: a square PNG (128 pixels) on a color
icon = icon.png
color = #d9803f
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/hello-linux-x86_64
run.macos-arm64 = bin/hello-macos-arm64
run.windows-x64 = bin/hello-windows-x64.exe
on = command

[commands]
say = Say Hello
upper = Upper-case the Document | ctrl+alt+shift+h

[subscribe]
opened = *

[needs]
documents = write
